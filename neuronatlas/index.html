<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NEYRON — Neuron structure</title>
    <script src="../page-base.js"></script>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get("theme");
          if (p !== "day" && p !== "night") p = localStorage.getItem("neyron_theme");
          if (p === "day" || p === "night") document.documentElement.setAttribute("data-theme", p);
          else document.documentElement.setAttribute("data-theme", "night");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "night");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../site.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.170.0/"
        }
      }
    </script>
  </head>
  <body class="neuron-structure-page" data-page="atlas">
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <div id="page">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="../index.html">
          <span class="brand-dot" aria-hidden="true"></span>
          NEYRON
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label class="nav-overlay" for="nav-toggle" aria-hidden="true"></label>
        <label class="nav-burger" for="nav-toggle" aria-label="Toggle menu"><span></span></label>
        <div class="nav-center" id="primary-navigation">
          <a class="nav-link" href="../index.html" data-nav="home" data-en="Home" data-az="Ana səhifə">Home</a>
          <a class="nav-link" href="../atlas.html" data-nav="atlas" data-en="Atlas" data-az="Atlas">Atlas</a>
          <a class="nav-link" href="../articles.html" data-nav="articles" data-en="Articles" data-az="Məqalələr">Articles</a>
          <a class="nav-link" href="../book.html" data-nav="book" data-en="Book" data-az="Kitab">Book</a>
        </div>
        <div class="nav-tools">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" id="lang-en" class="is-active">EN</button>
            <button type="button" id="lang-az">AZ</button>
          </div>
          <button type="button" class="theme-pill" id="theme-toggle" aria-label="Toggle theme">
            <span class="theme-pill__knob" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
              />
            </svg>
          </button>
        </div>
      </nav>

      <main class="neuron-structure-main" aria-label="Neuron structure viewer">
        <div id="root"></div>
      </main>
    </div>

    <div
      id="info-panel"
      style="
        position: fixed;
        right: -340px;
        top: 50%;
        transform: translateY(-50%);
        width: 280px;
        background: transparent;
        border-left: 1px solid rgba(255,255,255,0.12);
        padding: 28px 24px;
        z-index: 100;
        transition: right 0.5s cubic-bezier(0.16,1,0.3,1);
      "
    >
      <div
        id="panel-close"
        style="
          position: absolute;
          top: 0px;
          right: 0px;
          cursor: pointer;
          color: rgba(255,255,255,0.35);
          font-size: 11px;
          font-family: monospace;
          letter-spacing: 0.2em;
        "
      >
        ✕
      </div>
      <div
        id="panel-name"
        style="
          font-family: monospace;
          font-size: 0.65rem;
          font-weight: 400;
          color: rgba(255,255,255,0.92);
          letter-spacing: 0.35em;
          text-transform: uppercase;
          margin-bottom: 16px;
        "
      ></div>
      <div
        id="panel-desc"
        style="
          font-family: monospace;
          font-size: 0.68rem;
          color: rgba(200,200,200,0.88);
          line-height: 1.75;
          letter-spacing: 0.02em;
          font-weight: 300;
        "
      ></div>
    </div>
    <div
      id="creator-credit"
      style="
        position: fixed;
        left: 16px;
        bottom: 14px;
        z-index: 500;
        color: #ffffff;
        font-family: monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 1;
        pointer-events: none;
        user-select: none;
      "
    >
      2026 © Created by Omar Garagozov
    </div>

    <script type="module" src="app.js"></script>
    <script src="../site-shell.js" defer></script>
    <script src="../particles-bg.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof window.__neyronSiteShellSetLang !== "function") return;
        var qs = new URLSearchParams(location.search);
        var l = qs.get("lang");
        if (l === "en" || l === "az") window.__neyronSiteShellSetLang(l);
        var t = qs.get("theme");
        if (t === "day" || t === "night") window.__neyronSiteShellSetTheme(t);
      });
    </script>
  </body>
</html>
